name: Release

# Builds four native binaries for a pushed tag or an approved PR release.
# The web UI is embedded into each self-contained binary. A release is only
# published after all four builds and uploads have succeeded.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jobrabbit-linux-x86_64
            bin: jobrabbit
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jobrabbit-macos-arm64
            bin: jobrabbit
          # Intel macOS is cross-compiled on the Apple Silicon runner — the
          # scarce macos-13 Intel runners often never leave the queue.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: jobrabbit-macos-x86_64
            bin: jobrabbit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jobrabbit-windows-x86_64.exe
            bin: jobrabbit.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Linux links against D-Bus/X11 (notifications, idle); other OSes don't.
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxcb1-dev libxss-dev libx11-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # cargo embeds web-ui/dist via rust-embed, so build the frontend first.
      - name: Build frontend (embedded into the binary)
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Verify, upload and publish all binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            jobrabbit-linux-x86_64
            jobrabbit-macos-arm64
            jobrabbit-macos-x86_64
            jobrabbit-windows-x86_64.exe
          )
          for artifact in "${expected[@]}"; do
            test -s "dist/$artifact"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets | map(select(.size > 0) | .name)')
          for artifact in "${expected[@]}"; do
            jq -e --arg name "$artifact" 'index($name) != null' <<< "$assets" >/dev/null
          done
          gh release edit "$RELEASE_TAG" --draft=false
